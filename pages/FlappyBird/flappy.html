<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximun-scale=1.0, user-scalable=0">
    <title>flappy bird</title>
</head>
<body>
    
<canvas id="canvas" width="800px" height="500px"></canvas>

    <script>
        let canvas = document.getElementById('canvas')
        let ctx = canvas.getContext('2d')

        let birdSprite = new Image()
        birdSprite.src = 'assets/flappy_bird_sprites.png'

        let numBirdSprite = 0
        let tamBirdSprite = 28
        let posXBirdSprite = numBirdSprite * tamBirdSprite

        setTimeout(() => {
            numBirdSprite++
        }, 200);

        birdSprite.addEventListener('load', () =>{
            ctx.drawImage(birdSprite, posXBirdSprite, 490, 20, 20, 10, 20, 70, 70)
        })
    </script>
</body>
</html>
